var rl=LR/2,cnt=0,i,j,tot=LR*LR;
var idx=new Int32Array(tot),u0=new Float32Array(tot),r0=new Int32Array(tot);
for(j=0;j<LR;j++)for(i=0;i<LR;i++){
var x=(i+0.5-rl)/rl,y=(rl-(j+0.5))/rl,rr=x*x+y*y;
if(rr>1)continue;
var z=Math.sqrt(1-rr),px=x,py=-y*st+z*ct,pz=y*ct+z*st;
var lon=Math.atan2(py,-px),lat=Math.asin(pz>1?1:(pz<-1?-1:pz));
var u=(lon/6.2832+0.5)*CW,v=(0.5-lat/3.14159)*CH,vj=v|0;
if(vj>CH-1)vj=CH-1;if(vj<0)vj=0;
idx[cnt]=j*LR+i;u0[cnt]=u;r0[cnt]=vj*CW;cnt++;}
LPI=idx.subarray(0,cnt);LU=u0.subarray(0,cnt);LR0=r0.subarray(0,cnt);
landDirty=true;}
function landUpdate(e){
var shift=e/6.2832*CW,n=LPI.length,k;
lpix.fill(0);
for(k=0;k<n;k++){
var u=LU[k]+shift;u-=CW*Math.floor(u/CW);
var ci=u|0;if(ci>=CW)ci=0;
if(CG[LR0[k]+ci])lpix[LPI[k]]=LANDCOL;}
lctx.putImageData(limg,0,0);}
var AX=new Float32Array(OBS),AY=new Float32Array(OBS),AZ=new Float32Array(OBS),SK=new Float32Array(OBS);
(function(){
var r=rng(21);
for(var k=0;k<OBS;k++){
var ex=(r()+r()+r()-1.5)*0.1,ey=(r()+r()+r()-1.5)*0.1,l=1/Math.sqrt(ex*ex+ey*ey+1);
AX[k]=ex*l;AY[k]=ey*l;AZ[k]=l;SK[k]=1+(r()-0.5)*0.12;}
})();
var GV=new Uint32Array(256);for(var gi=0;gi<256;gi++)GV[gi]=((255<<24)|(gi<<16)|(gi<<8)|gi)>>>0;
var dc=document.createElement('canvas'),dctx=dc.getContext('2d');
var W,H,dpr,cx,cy,R,Rp,side,half,dsz,ox,oy,dotpx,img,buf,LQ=2;
function layout(){
dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
if(W<700){cx=W/2;cy=H*0.40;R=Math.min(W*0.28,H*0.2);}
else{cx=W/2;cy=H*0.44;R=Math.min(W*0.24,H*0.27);}
R=Math.max(R,50);Rp=R*LQ;
side=Math.ceil(3.4*Rp/2)*2;half=side/2;dsz=side*dpr/LQ;
ox=Math.round(cx*dpr-dsz/2);oy=Math.round(cy*dpr-dsz/2);
dc.width=side;dc.height=side;
img=dctx.createImageData(side,side);buf=new Uint32Array(img.data.buffer);
dotpx=Math.max(2,Math.round(Math.max(1.15,R/200)*LQ*3.4));pat=ctx.createPattern(tile,'repeat');landPrep();hud.style.top=Math.min(H-72,cy+R*1.32+14)+'px';}
function globe(spin,gi){
var c=cx*dpr,d=cy*dpr,r=R*dpr;
var lw=1.2*dpr;
ctx.beginPath();ctx.arc(c,d,r,0,6.2832);ctx.fillStyle='#002FA7';ctx.fill();
if(landDirty||Math.abs(spin-lastLand)*162.97>0.3){landUpdate(spin);lastLand=spin;landDirty=false;}
ctx.imageSmoothingEnabled=false;ctx.drawImage(lc,c-r,d-r,2*r,2*r);ctx.imageSmoothingEnabled=true;
ctx.save();ctx.beginPath();ctx.arc(c,d,r,0,6.2832);ctx.clip();
var gx=(gi*7919)%256,gy=(gi*104729)%256;
ctx.scale(dpr,dpr);ctx.translate(gx,gy);ctx.fillStyle=pat;
ctx.fillRect((c-r)/dpr-gx,(d-r)/dpr-gy,2*r/dpr,2*r/dpr);ctx.restore();
ctx.lineWidth=lw;ctx.strokeStyle='rgba(255,255,255,0.35)';
function line(f,n){
ctx.beginPath();var pen=false;
for(var i=0;i<=n;i++){var p=f(i/n),sy=-p[1]*st+p[2]*ct,dd=p[1]*ct+p[2]*st;
if(dd>=0){var x=c+p[0]*r,y=d-sy*r;if(pen)ctx.lineTo(x,y);else ctx.moveTo(x,y);pen=true;}else pen=false;}
ctx.stroke();}
[-60,-30,0,30,60].forEach(function(la){var l=la*Math.PI/180;
line(function(t){var a=t*6.2832;return[Math.cos(l)*Math.cos(a),Math.cos(l)*Math.sin(a),Math.sin(l)];},120);});
for(var m=0;m<12;m++){(function(m){var l0=m*Math.PI/6+spin;
line(function(t){var la=-1.5708+t*3.1416;return[Math.cos(la)*Math.cos(l0),Math.cos(la)*Math.sin(l0),Math.sin(la)];},60);})(m);}
ctx.beginPath();ctx.arc(c,d,r,0,6.2832);ctx.strokeStyle='#5978c6';ctx.lineWidth=lw;ctx.stroke();}
function drawDots(n,spin){
buf.fill(0);
var s=dotpx,lim=side-s,h=half,rp=Rp,hs=s/2,n1=n<OBS?n:OBS,k,yy,xx,j;
for(k=0;k<n1;k++){
var x0=X0[k],y0=Y0[k],z0=Z0[k],th=spin*SK[k],cc=Math.cos(th),ss=Math.sin(th);
var ax=AX[k],ay=AY[k],az=AZ[k],dp=(ax*x0+ay*y0+az*z0)*(1-cc);
var px=x0*cc+(ay*z0-az*y0)*ss+ax*dp,py=y0*cc+(az*x0-ax*z0)*ss+ay*dp,pz=z0*cc+(ax*y0-ay*x0)*ss+az*dp;
var d=py*ct+pz*st,sy=-py*st+pz*ct;
if(d<0&&px*px+sy*sy<1)continue;
var x=(h+px*rp-hs)|0,y=(h-sy*rp-hs)|0;
if(x<0||y<0||x>=lim||y>=lim)continue;
var q=(d*IR[k]+1)*0.625;q=q<0?0:(q>1?1:q);q=q*q*(3-2*q);
var g=((0.3+0.7*q)*255)|0,val=GV[g],i=y*side+x;
for(yy=0;yy<s;yy++){j=i+yy*side;for(xx=0;xx<s;xx++){if((buf[j+xx]&255)<g)buf[j+xx]=val;}}}
if(n>OBS){
var s2=Math.max(2,Math.round(s*0.25)),lim2=side-s2,hs2=s2/2,cs=Math.cos(spin),sn=Math.sin(spin);
for(k=OBS;k<n;k++){
var u0=X0[k],v0=Y0[k],w0=Z0[k];
var qx=u0*cs-v0*sn,qy=u0*sn+v0*cs;
var dd=qy*ct+w0*st,sy2=-qy*st+w0*ct;
if(dd<0&&qx*qx+sy2*sy2<1)continue;
var x2=(h+qx*rp-hs2)|0,y2=(h-sy2*rp-hs2)|0;
if(x2<0||y2<0||x2>=lim2||y2>=lim2)continue;
var q2=(dd*IR[k]+1)*0.625;q2=q2<0?0:(q2>1?1:q2);q2=q2*q2*(3-2*q2);
var g2=((0.3+0.7*q2)*166)|0,val2=GV[g2],i2=y2*side+x2;
for(yy=0;yy<s2;yy++){j=i2+yy*side;for(xx=0;xx<s2;xx++){if((buf[j+xx]&255)<g2)buf[j+xx]=val2;}}}}
dctx.putImageData(img,0,0);}

function ease(p){return p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;}
function stateAt(t){
var n=0,idx=-1;
for(var i=0;i<T.length;i++){var s=T[i];
if(t>=s.s){idx=i;var p=Math.min(1,(t-s.s)/s.d);n=s.f+(s.t-s.f)*ease(p);}}
return{n:Math.round(n),idx:idx};}

var tNow=0,tt=0,raf=0,dirty=true,lastN=-1,lastIdx=-9,lastOn=null;
var embed=/[?&]mode=embed/.test(location.search);
if(embed)document.documentElement.classList.add('embed');
function notify(s){
if(window.parent!==window)window.parent.postMessage({type:'orbit-state',year:s.idx>=0?T[s.idx].y:null,count:s.n,stage:s.idx},'*');}
function render(){
var s=stateAt(tNow);
if(s.n!==lastN){cnt.textContent=s.n.toLocaleString('en-US').replace(/,/g,'\u00a0');lastN=s.n;dirty=true;notify(s);}
var on=tNow>=0.7;
if(on!==lastOn){hud.classList.toggle('on',on);lastOn=on;}
if(s.idx!==lastIdx){
if(s.idx<0){yearEl.textContent='';yearEl.classList.remove('in');}
else{yearEl.textContent=T[s.idx].y;yearEl.classList.remove('in');void yearEl.offsetWidth;yearEl.classList.add('in');}
lastIdx=s.idx;notify(s);}
if(dirty){
var sp=tNow*wE;
ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
globe(-0.3*sp,Math.floor(tNow*18));
drawDots(s.n,sp);
ctx.drawImage(dc,ox,oy,dsz,dsz);
dirty=false;}}
function tick(){
raf=0;
var prev=tNow;
tNow=reduce?tt:tNow+(tt-tNow)*0.18;
if(Math.abs(tt-tNow)<0.002)tNow=tt;
if(tNow!==prev)dirty=true;
render();
if(tNow!==tt)raf=requestAnimationFrame(tick);}
function setProgress(p){
p=p<0?0:(p>1?1:p);tt=p*TOTAL;
if(!raf)raf=requestAnimationFrame(tick);}
function onScroll(){
var b=track.getBoundingClientRect(),len=b.height-window.innerHeight;
setProgress(len>0?-b.top/len:0);}
window.addEventListener('message',function(e){
if(window.parent!==window&&e.source!==window.parent)return;
var d=e.data;
if(d&&d.type==='orbit-progress'&&typeof d.value==='number')setProgress(d.value);});
if(!embed)window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',function(){layout();dirty=true;if(!embed)onScroll();});
window.orbit={setProgress:setProgress,timeline:T,total:TOTAL};
layout();
if(!embed){var b0=track.getBoundingClientRect(),l0=b0.height-window.innerHeight;tt=(l0>0?Math.max(0,Math.min(1,-b0.top/l0)):0)*TOTAL;}
tNow=tt;
render();
})();
</script>
